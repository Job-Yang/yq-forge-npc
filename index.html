<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YQ 铁匠铺 · 打工人语音面板 v2.7.1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  body {
    background: url("assets/img/bg.jpeg") center/cover no-repeat;
    position: relative;
    user-select: none;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,15,10,0.10) 0%, rgba(20,15,10,0.30) 100%);
    pointer-events: none;
    z-index: 1;
    transition: background 1.5s ease;
  }

  /* ============ 天气系统 v2.5 ============
     设计：canvas 渲染雨滴/闪电/月亮/星星(性能 +可控)
            CSS 只负责持久调色 tint 层(背景滤镜)
            保留背景层次,不一片灰
  ============================================ */

  /* 调色 tint —— mix-blend-mode 保留底图细节 */
  .tint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 1s ease;
  }
  body[data-weather="sunny"] .tint.sunny {
    opacity: 1;
    background: radial-gradient(ellipse at 75% 10%, rgba(255,230,120,0.35) 0%, rgba(255,180,80,0.10) 25%, transparent 55%);
  }
  body[data-weather="rain"] .tint.rain {
    opacity: 1;
    background: linear-gradient(180deg, rgba(20,30,50,0.25) 0%, rgba(20,40,70,0.45) 100%);
    mix-blend-mode: multiply;
  }
  body[data-weather="night"] .tint.night {
    opacity: 1;
    background: linear-gradient(180deg, rgba(20,20,55,0.55) 0%, rgba(8,8,30,0.80) 100%);
    mix-blend-mode: multiply;
  }

  /* canvas 全屏画特效 */
  .fx-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* 天气指示器(右上角小标签) */
  .weather-tag {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .weather-tag:hover {
    background: rgba(40,30,20,0.85);
  }

  /* 顶部 hint 条 */
  .hint {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 12px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
  }
  .hint .key { color: #ffd766; font-weight: bold; }

  /* 舞台 —— 整个视窗作为活动区域，NPC 用 absolute 自由行走 */
  .stage {
    position: absolute; inset: 0;
    z-index: 5;
  }

  /* 地面带 —— 底部 35% 是 NPC 行走范围，仅用于视觉调试可去掉 */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 35%;
    pointer-events: none;
  }

  /* NPC */
  .npc {
    position: absolute;
    bottom: 0;
    cursor: pointer;
    transition: transform 0.18s ease-out;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.45));
    will-change: left, transform;
  }
  .npc:hover {
    transform: translateY(-6px) scale(1.04);
  }
  .npc.talking {
    animation: shake 0.4s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-4px) rotate(-2deg) scale(1.05); }
    50% { transform: translateY(-8px) rotate(0) scale(1.06); }
    75% { transform: translateY(-4px) rotate(2deg) scale(1.05); }
  }
  /* 角色 img 单独翻转,不影响气泡/名牌 */
  .sprite {
    height: 38vh;
    max-height: 320px;
    display: block;
    transition: transform 0.1s linear;
  }
  .npc[data-facing="left"] .sprite {
    transform: scaleX(-1);
  }

  /* 名牌 */
  .nameplate {
    position: absolute;
    bottom: -22px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* 对话气泡 —— 像素风游戏台词框 */
  .bubble {
    position: absolute;
    top: -64px;
    left: 50%; transform: translateX(-50%) scale(0);
    background: linear-gradient(180deg, #f8e7b8 0%, #e8c98a 100%);
    color: #2a1a05;
    padding: 10px 18px;
    font-size: 18px;
    font-weight: bold;
    font-family: "Courier New", "PingFang SC", monospace;
    letter-spacing: 1px;
    /* 关键修复:气泡不再被坍缩成竖排 */
    width: max-content;
    min-width: 80px;
    max-width: min(280px, 60vw);
    white-space: normal;
    word-break: keep-all;       /* 不在汉字中间断行 */
    overflow-wrap: break-word;  /* 但允许整词换行避免溢出 */
    /* 多层 box-shadow 模拟像素台阶边框 */
    box-shadow:
      0 0 0 3px #2a1a05,
      0 0 0 6px #d4a85a,
      0 0 0 9px #2a1a05,
      6px 6px 0 9px rgba(0,0,0,0.45);
    border-radius: 2px;
    transition: transform 0.22s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    pointer-events: none;
    text-align: center;
    line-height: 1.35;
    z-index: 9;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
  }
  .bubble.show {
    transform: translateX(-50%) scale(1);
  }
  /* 像素风台阶式小尖角 —— 用伪元素堆三层方块模拟 */
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -9px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 6px;
    background: #e8c98a;
    box-shadow:
      -3px 0 0 #e8c98a,
      3px 0 0 #e8c98a,
      0 0 0 3px #2a1a05,
      -3px 3px 0 #2a1a05,
      3px 3px 0 #2a1a05;
  }
  .bubble::before {
    content: "";
    position: absolute;
    bottom: -15px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px;
    background: #e8c98a;
    box-shadow: 0 0 0 3px #2a1a05;
  }

  /* footer 计数器 */
  .footer {
    position: absolute;
    bottom: 8px; left: 12px;
    z-index: 10;
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 1px;
  }
  .footer span { color: #ffd766; }

  /* 全局喊话按钮 */
  .global-btn {
    position: absolute;
    bottom: 8px; right: 12px;
    z-index: 10;
    background: rgba(120,40,30,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
  }
  .global-btn:hover {
    background: rgba(170,60,40,0.95);
  }

  /* 静音切换按钮 */
  .mute-btn {
    position: absolute;
    bottom: 8px; right: 92px;
    z-index: 10;
    background: rgba(40,30,20,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
    min-width: 64px;
    text-align: center;
  }
  .mute-btn:hover {
    background: rgba(70,55,35,0.95);
  }
  .mute-btn.muted {
    background: rgba(60,60,60,0.85);
    color: #999;
    border-color: #666;
  }

  /* ============ v2.6 加载蒙层 ============ */
  .loader {
    position: fixed; inset: 0;
    background: #1a1410;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffe9a8;
    font-family: inherit;
    transition: opacity 0.5s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader-title {
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 16px;
    text-shadow: 1px 1px 0 #000;
  }
  .loader-bar {
    width: 240px;
    height: 14px;
    border: 2px solid #ffd766;
    background: #0a0805;
    padding: 1px;
    image-rendering: pixelated;
  }
  .loader-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffb84a 0%, #ffd766 50%, #ffb84a 100%);
    transition: width 0.15s linear;
  }
  .loader-pct {
    margin-top: 8px;
    font-size: 11px;
    color: #c7a060;
  }
  .loader-hint {
    margin-top: 14px;
    font-size: 10px;
    color: #7a6040;
    letter-spacing: 1px;
  }

  /* ============ v2.7 金矿 ============ */
  .goldmine {
    position: absolute;
    bottom: 4%;
    right: 3%;
    width: 220px;
    height: auto;
    z-index: 4;
    pointer-events: none;
    image-rendering: pixelated;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .goldmine img { width: 100%; height: auto; object-fit: contain; }
  .goldmine.shake { animation: mine-shake 0.4s ease-in-out; }
  @keyframes mine-shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, 2px); }
  }
  .gold-spark {
    position: absolute;
    top: 30%; left: 40%;
    width: 8px; height: 8px;
    background: #ffd766;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 12px 4px #ffd766;
  }
  .goldmine.spark .gold-spark {
    animation: spark-fly 0.6s ease-out;
  }
  @keyframes spark-fly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(40px, -60px) scale(0.3); }
  }

  /* ============ v2.7 金币计数器 ============ */
  .gold-counter {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 50;
    background: rgba(40,30,20,0.85);
    border: 2px solid #ffd766;
    border-radius: 4px;
    padding: 6px 12px;
    color: #ffe9a8;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #000;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gold-counter.bump { animation: gold-bump 0.4s ease; }
  @keyframes gold-bump {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.18); color: #fff; }
  }
  .gold-icon { font-size: 16px; }
  .gold-tip {
    font-size: 10px;
    color: #c7a060;
    margin-left: 10px;
    letter-spacing: 0;
  }
  .gold-counter.unlocked .gold-tip {
    color: #6ee765;
  }

  /* ============ v2.7 豆包偷窥 ============ */
  .doubao-peek {
    position: fixed;
    z-index: 45;
    width: 70px;
    height: 75px;
    opacity: 0;
    pointer-events: none;
    image-rendering: pixelated;
    transition: opacity 0.5s ease, transform 1s ease;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.5));
  }
  .doubao-peek img { width: 100%; height: 100%; object-fit: contain; }
  .doubao-peek.peek-right {
    right: -40px;
    top: 22%;
    transform: translateX(0);
  }
  .doubao-peek.peek-right.show {
    opacity: 1;
    transform: translateX(-50px);
  }
  .doubao-peek.peek-left {
    left: -40px;
    top: 35%;
    transform: translateX(0) scaleX(-1);
  }
  .doubao-peek.peek-left.show {
    opacity: 1;
    transform: translateX(50px) scaleX(-1);
  }
  .doubao-peek.peek-top {
    top: -40px;
    left: 60%;
    transform: translateY(0) rotate(180deg);
  }
  .doubao-peek.peek-top.show {
    opacity: 1;
    transform: translateY(50px) rotate(180deg);
  }

  /* ============ v2.7 深夜彩蛋调色 ============ */
  body.late-night::before {
    background: linear-gradient(180deg, rgba(15,10,30,0.45) 0%, rgba(10,5,25,0.65) 100%);
  }
</style>
</head>
<body>

<!-- v2.6 加载蒙层 -->
<div class="loader" id="loader">
  <div class="loader-title">⚒ 铁匠铺加载中</div>
  <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
  <div class="loader-pct" id="loader-pct">0%</div>
  <div class="loader-hint">炉火正在升温…</div>
</div>

<div class="hint">
  <span class="key">👆 点击 NPC</span> 听他说话 · <span class="key">他们会自己瞎逛</span>
</div>

<!-- 天气调色层(只负责持久滤镜,canvas 负责粒子) -->
<div class="tint sunny"></div>
<div class="tint rain"></div>
<div class="tint night"></div>

<!-- 天气特效 canvas(雨/闪电/月亮/星星) -->
<canvas class="fx-canvas" id="fx-canvas"></canvas>

<!-- v2.7 金矿(地面右侧固定位置) -->
<div class="goldmine" id="goldmine" title="苦工/农民会自动来挖矿">
  <img src="assets/img/goldmine.png" alt="Gold Mine" />
  <div class="gold-spark"></div>
</div>

<!-- v2.7 豆包脸偷窥(随机从边缘出现) -->
<div class="doubao-peek" id="doubao-peek">
  <img src="assets/img/doubao_peek.png" alt="豆包" />
</div>

<!-- v2.7 金币计数器(左上角) -->
<div class="gold-counter" id="gold-counter" title="苦工和农民挖到的金币">
  <span class="gold-icon">🪙</span><span id="gold-num">0</span>
  <span class="gold-tip">解锁第 4 个 NPC: 100</span>
</div>

<!-- 右上角天气指示器,点击手动切换 -->
<div class="weather-tag" id="weather-tag" title="点击切换天气">☀️ 晴</div>

<div class="stage" id="stage">
  <!-- 人族农民 -->
  <div class="npc" id="peasant" data-role="peasant" data-facing="right">
    <div class="bubble" id="bubble-peasant"></div>
    <img class="sprite" id="img-peasant" src="assets/img/peasant_idle1.png" alt="Peasant" />
    <div class="nameplate">⚔ 人族农民</div>
  </div>

  <!-- 兽族苦工 -->
  <div class="npc" id="peon" data-role="peon" data-facing="left">
    <div class="bubble" id="bubble-peon"></div>
    <img class="sprite" id="img-peon" src="assets/img/peon_idle1.png" alt="Peon" />
    <div class="nameplate">🪓 兽族苦工</div>
  </div>

  <!-- 工程师 YQ -->
  <div class="npc" id="yq" data-role="yq" data-facing="right">
    <div class="bubble" id="bubble-yq"></div>
    <img class="sprite" id="img-yq" src="assets/img/yq_idle1.png" alt="YQ" />
    <div class="nameplate">💻 工程师 YQ</div>
  </div>
</div>

<div class="footer">
  YQ 的铁匠铺 · 打工人语音面板 v2.7.1 · 点击数:<span id="counter">0</span>
</div>

<button class="mute-btn" id="mute-btn" title="切换语音">🔊 有声</button>
<button class="global-btn" id="global-btn">🔔 集结!</button>

<script>
// =========================================================
// 0. v2.6 资源预加载 + loading 蒙层（关键资源优先 + 渐进可玩）
// =========================================================
(function () {
  // 关键资源：背景 + 3 个 idle 帧，加载完就放行(4 张,1MB 左右)
  const CRITICAL = [
    'assets/img/bg.jpeg',
    'assets/img/peasant_idle1.png',
    'assets/img/peon_idle1.png',
    'assets/img/yq_idle1.png',
    'assets/img/goldmine.png',
  ];
  // 后台继续加载：walk/talk 帧 + 豆包,不阻塞首屏
  const SECONDARY = [
    'assets/img/peasant_walk1.png', 'assets/img/peasant_walk2.png', 'assets/img/peasant_talk1.png',
    'assets/img/peon_walk1.png', 'assets/img/peon_walk2.png', 'assets/img/peon_talk1.png',
    'assets/img/yq_walk1.png', 'assets/img/yq_walk2.png', 'assets/img/yq_talk1.png',
    'assets/img/doubao_peek.png',
  ];

  const loader = document.getElementById('loader');
  const fill = document.getElementById('loader-fill');
  const pct = document.getElementById('loader-pct');
  const hint = loader.querySelector('.loader-hint');
  let done = 0;
  let released = false;

  function release() {
    if (released) return;
    released = true;
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 600);
  }
  function tick() {
    done++;
    const p = Math.round(done / CRITICAL.length * 100);
    fill.style.width = p + '%';
    pct.textContent = p + '%';
    if (done >= CRITICAL.length) {
      hint.textContent = '炉火已起,开工!';
      setTimeout(release, 150);
    }
  }
  CRITICAL.forEach(src => {
    const img = new Image();
    img.onload = tick;
    img.onerror = tick;
    img.src = src;
  });
  // 后台加载次要资源,不影响首屏放行;NPC 行为代码已用 idle 兜底
  SECONDARY.forEach(src => { const img = new Image(); img.src = src; });
  // 兜底: 3 秒后无论如何都放行(关键资源 4 张,正常 < 1s)
  setTimeout(release, 3000);
})();

// =========================================================
// 1. 资源池
// =========================================================
const SPRITES = {
  peasant: {
    idle:  ['assets/img/peasant_idle1.png'],
    walk:  ['assets/img/peasant_walk1.png', 'assets/img/peasant_walk2.png'],
    talk:  ['assets/img/peasant_talk1.png'],
  },
  peon: {
    idle:  ['assets/img/peon_idle1.png'],
    walk:  ['assets/img/peon_walk1.png', 'assets/img/peon_walk2.png'],
    talk:  ['assets/img/peon_talk1.png'],
  },
  yq: {
    idle:  ['assets/img/yq_idle1.png'],
    walk:  ['assets/img/yq_walk1.png', 'assets/img/yq_walk2.png'],
    talk:  ['assets/img/yq_talk1.png'],
  },
};

const VOICE_POOL = {
  peasant: {
    yes:       ['peasantyes1', 'peasantyes2', 'peasantyes3', 'peasantyes4'],
    what:      ['peasantwhat1', 'peasantwhat2', 'peasantwhat3', 'peasantwhat4'],
    pissed:    ['peasantpissed1', 'peasantpissed2', 'peasantpissed3', 'peasantpissed4', 'peasantpissed5'],
    ready:     ['peasantready1'],
    yesattack: ['peasantyesattack1', 'peasantyesattack2', 'peasantyesattack3', 'peasantyesattack4'],
    warcry:    ['peasantwarcry1'],
  },
  peon: {
    yes:       ['peonyes1', 'peonyes2', 'peonyes3', 'peonyes4'],
    what:      ['peonwhat1', 'peonwhat2', 'peonwhat3', 'peonwhat4'],
    pissed:    ['peonpissed1', 'peonpissed2', 'peonpissed3', 'peonpissed4'],
    ready:     ['peonready1'],
    yesattack: ['peonyesattack1', 'peonyesattack2', 'peonyesattack3'],
    warcry:    ['peonwarcry1'],
  },
  // YQ 无语音
};

const BUBBLE_LINES = {
  peasant: {
    yes:       ['好的老爷!', '收到!', '没问题!', '马上!'],
    what:      ['啥?', '你想干嘛?', '叫我?', '咋了?'],
    pissed:    ['又要干活...', '忙着呢,别烦我', '能不能歇会儿', '我累了!'],
    yesattack: ['行了,我去送死了', '上!', '冲啊!'],
    warcry:    ['相信自己我能行!'],
  },
  peon: {
    yes:       ['是,老大', 'ok!', '懂了', '马上去'],
    what:      ['啊?', '咋啦?', '叫俺?'],
    pissed:    ['忙啊忙', '我可不是那种兽人', '别催我啊', '砍累了'],
    yesattack: ['我去会会他们!', '战斗!'],
    warcry:    ['为了部落!'],

// 3. 工具函数

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getStageWidth() {
  return STAGE.clientWidth || window.innerWidth;
}

// =========================================================
// 4. 音频播放(带取消机制)
// =========================================================
function playVoice(role, emotion) {
  if (!VOICE_POOL[role]) return null; // YQ 无声
  if (isMuted) return null;           // 🔇 用户静音了
  const pool = VOICE_POOL[role][emotion];
  if (!pool || pool.length === 0) return null;

  // 🔥 取消正在播放的音频
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
    currentAudio = null;
  }

  const file = randomFrom(pool);
  const audio = new Audio(`assets/audio/${role}/${file}.ogg`);
  audio.volume = 0.85;
  audio.play().catch(err => console.warn('音频播放失败:', err));
  currentAudio = audio;
  // 播完清空引用,避免后续误取消
  audio.addEventListener('ended', () => {
    if (currentAudio === audio) currentAudio = null;
  });
  return audio;
}

// =========================================================
// 5. 气泡显示
// =========================================================
function showBubble(role, text) {
  const bubble = document.getElementById(`bubble-${role}`);
  if (!bubble) return;
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubble._timer);
  // 动态时长:基础 3s + 每字 0.18s,封顶 9s,最少 3s
  const dur = Math.max(3000, Math.min(9000, 3000 + text.length * 180));
  bubble._timer = setTimeout(() => bubble.classList.remove('show'), dur);
}

// =========================================================
// 6. NPC 控制器(每个 NPC 一个实例,管动画 + 走路)
// =========================================================
class NPC {
  constructor(role, startXPercent) {
    this.role = role;
    this.el = document.getElementById(role);
    this.img = document.getElementById(`img-${role}`);
    this.frames = SPRITES[role];

    // 位置(px)
    this.x = (getStageWidth() * startXPercent) / 100;
    this.targetX = this.x;
    this.speed = 0.6; // px / frame
    this.state = 'idle'; // idle | walk | talk
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.lastTs = performance.now();

    // 决策计时器:每隔 N ms 决定下一步做什么
    this.decisionTimer = 0;
    this.nextDecision = 1500 + Math.random() * 2000;

    this.applyPos();
    requestAnimationFrame(this.tick.bind(this));
  }

  applyPos() {
    this.el.style.left = `${this.x}px`;
    this.el.style.transform = 'translateX(-50%)';
  }

  setState(state) {
    if (this.state === state) return;
    this.state = state;
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.updateFrame();
  }

  updateFrame() {
    const pool = this.frames[this.state] || this.frames.idle;
    const src = pool[this.frameIdx % pool.length];
    if (this.img.getAttribute('src') !== src) {
      this.img.setAttribute('src', src);
    }
  }

  setFacing(dir) {
    this.el.dataset.facing = dir;
  }

  pickNewTarget() {
    const w = getStageWidth();
    // 在 5% ~ 95% 范围随机
    const min = w * 0.05;
    const max = w * 0.95;
    this.targetX = min + Math.random() * (max - min);
    this.setFacing(this.targetX > this.x ? 'right' : 'left');
    this.setState('walk');
  }

  talkOnce(durationMs = 600) {
    this.setState('talk');
    clearTimeout(this._talkTimer);
    this._talkTimer = setTimeout(() => {
      // 说完回到 idle(或者继续 walk 如果之前在走)
      this.setState('idle');
      this.decisionTimer = 0;
      this.nextDecision = 1500 + Math.random() * 2000;
    }, durationMs);
  }

  tick(ts) {
    const dt = Math.min(50, ts - this.lastTs);
    this.lastTs = ts;

    // 行走逻辑
    if (this.state === 'walk') {
      const dx = this.targetX - this.x;
      if (Math.abs(dx) < 2) {
        // 到达,切回 idle 等待下次决策
        this.x = this.targetX;
        this.applyPos();
        this.setState('idle');
        this.decisionTimer = 0;
        this.nextDecision = 1500 + Math.random() * 3000;
      } else {
        const step = Math.sign(dx) * this.speed * (dt / 16.67);
        this.x += step;
        this.applyPos();
      }
    }

    // 帧动画切换
    this.frameTimer += dt;
    const cadence = this.state === 'walk' ? 220 : 600;
    if (this.frameTimer >= cadence) {
      this.frameTimer = 0;
      this.frameIdx++;
      this.updateFrame();
    }

    // 自主决策:idle 状态下隔一段时间随机决定下一步
    if (this.state === 'idle') {
      this.decisionTimer += dt;
      if (this.decisionTimer >= this.nextDecision) {
        this.decisionTimer = 0;
        // 60% 概率走起来,40% 继续发呆
        if (Math.random() < 0.6) {
          this.pickNewTarget();
        } else {
          this.nextDecision = 1500 + Math.random() * 2500;
        }
      }
    }

    requestAnimationFrame(this.tick.bind(this));
  }
}

// =========================================================
// 11. 天气系统 v2.5 —— canvas 渲染,戏剧化像素风
//   - 雨：3 层视差 + 风向摇摆 + 地面溅落 sprite
//   - 暴雨：随机闪电(全屏闪光 + 锯齿闪电几何 + 蓝色余晖)
//   - 夜：星空缓动闪烁 + 像素月亮
//   - 切换：手动点右上角(sunny→rain→night→sunny)
// =========================================================
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
fxCtx.imageSmoothingEnabled = false;

const WEATHER_ORDER = ['sunny', 'rain', 'night'];
const WEATHER_META = {
  sunny: { tag: '☀️ 晴',  yqLines: ['天好,代码也跑得欢', '阳光这么好,适合等 CI', '今天的灵感来自一次 retry'] },
  rain:  { tag: '🌧 暴雨', yqLines: ['下雨打雷,服务器可别也下', '雨声陪我加班', '回滚到 AI 介入之前'] },
  night: { tag: '🌙 夜',  yqLines: ['夜了,但 Agent 不睡', '深夜的 commit 最危险', '我不是在摸鱼,我在等GPT 5.5'] },
};
let weatherIdx = 0;
let currentWeather = 'sunny';
const weatherTag = document.getElementById('weather-tag');

// canvas 尺寸适配 DPR
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fxCanvas.width  = window.innerWidth * dpr;
  fxCanvas.height = window.innerHeight * dpr;
  fxCanvas.style.width  = window.innerWidth + 'px';
  fxCanvas.style.height = window.innerHeight + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ---- 粒子池 ----
const drops = [];      // 雨滴
const splashes = [];   // 溅落
const stars = [];      // 星星
let wind = 0;          // 当前风向(像素/帧)
let flash = 0;         // 全屏闪光强度 0~1
let afterglow = 0;     // 闪电后的蓝色余晖
let bolt = null;       // 当前闪电几何
let nextStrike = 0;    // 下次打雷的时间戳

function seedRain() {
  drops.length = 0;
  const W = window.innerWidth, H = window.innerHeight;
  // 3 层视差: layer 1 远小, 2 中, 3 近大
  for (let i = 0; i < 220; i++) {
    const layer = 1 + (i % 3);
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      v: 4 + Math.random() * 4 + layer * 2,
      layer,
    });
  }
}
function seedStars() {
  stars.length = 0;
  const W = window.innerWidth, H = window.innerHeight * 0.55; // 只在天空区域
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() < 0.85 ? 1 : 2,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() < 0.85 ? '#ffffff' : '#ffe080',
    });
  }
}
seedRain();
seedStars();

// 闪电：递归生成锯齿折线
function makeBolt() {
  const W = window.innerWidth, H = window.innerHeight;
  const startX = W * (0.2 + Math.random() * 0.6);
  const segments = [{ x: startX, y: 0 }];
  let y = 0;
  while (y < H * 0.7) {
    const last = segments[segments.length - 1];
    y += 15 + Math.random() * 25;
    segments.push({
      x: last.x + (Math.random() - 0.5) * 60,
      y,
    });
    // 偶尔来一道分叉
    if (Math.random() < 0.15) {
      let bx = last.x, by = last.y;
      const branch = [{ x: bx, y: by }];
      for (let i = 0; i < 4; i++) {
        bx += (Math.random() - 0.5) * 40;
        by += 12 + Math.random() * 18;
        branch.push({ x: bx, y: by });
      }
      segments.push({ branch });
    }
  }
  return { segments, life: 12 };
}
function drawBolt(b) {
  const a = b.life / 12;
  // 外层光晕
  fxCtx.strokeStyle = `rgba(180,200,255,${0.35 * a})`;
  fxCtx.lineWidth = 8;
  fxCtx.lineCap = 'round';
  fxCtx.beginPath();
  let prev = null;
  for (const s of b.segments) {
    if (s.branch) {
      fxCtx.moveTo(s.branch[0].x, s.branch[0].y);
      for (const p of s.branch) fxCtx.lineTo(p.x, p.y);
      continue;
    }
    if (!prev) fxCtx.moveTo(s.x, s.y);
    else fxCtx.lineTo(s.x, s.y);
    prev = s;
  }
  fxCtx.stroke();
  // 内核白光
  fxCtx.strokeStyle = `rgba(255,255,255,${a})`;
  fxCtx.lineWidth = 2;
  fxCtx.beginPath();
  prev = null;
  for (const s of b.segments) {
    if (s.branch) {
      fxCtx.moveTo(s.branch[0].x, s.branch[0].y);
      for (const p of s.branch) fxCtx.lineTo(p.x, p.y);
      continue;
    }
    if (!prev) fxCtx.moveTo(s.x, s.y);
    else fxCtx.lineTo(s.x, s.y);
    prev = s;
  }
  fxCtx.stroke();
}

function drawMoon() {
  const W = window.innerWidth;
  const cx = W * 0.82, cy = 80;
  // 月晕
  const halo = fxCtx.createRadialGradient(cx, cy, 10, cx, cy, 60);
  halo.addColorStop(0, 'rgba(255,240,200,0.45)');
  halo.addColorStop(1, 'rgba(255,240,200,0)');
  fxCtx.fillStyle = halo;
  fxCtx.fillRect(cx - 60, cy - 60, 120, 120);
  // 月本体(像素圆)
  fxCtx.fillStyle = '#fff5d4';
  for (let dy = -16; dy <= 16; dy += 2) {
    const w = Math.floor(Math.sqrt(256 - dy * dy));
    fxCtx.fillRect(cx - w, cy + dy, w * 2, 2);
  }
  // 月相阴影
  fxCtx.fillStyle = 'rgba(40,30,60,0.45)';
  for (let dy = -12; dy <= 12; dy += 2) {
    const w = Math.floor(Math.sqrt(144 - dy * dy));
    fxCtx.fillRect(cx - w - 6, cy + dy, w * 2, 2);
  }
}

let lastFrame = performance.now();
function weatherTick(now) {
  requestAnimationFrame(weatherTick);
  const dt = Math.min(40, now - lastFrame);
  lastFrame = now;
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (currentWeather === 'rain') {
    const W = window.innerWidth, H = window.innerHeight;
    // 风向缓慢摇摆,偶尔来一阵
    wind = Math.sin(now / 1800) * 2 + Math.sin(now / 350) * 0.4;

    // 雨滴
    fxCtx.lineCap = 'round';
    for (const d of drops) {
      const speed = d.v * (dt / 16.67);
      d.y += speed;
      d.x += wind * d.layer * 0.5;
      const alpha = 0.20 + d.layer * 0.22;
      fxCtx.strokeStyle = `rgba(190,210,240,${alpha})`;
      fxCtx.lineWidth = d.layer;
      fxCtx.beginPath();
      fxCtx.moveTo(d.x, d.y);
      fxCtx.lineTo(d.x - wind * 1.5, d.y - 5 * d.layer);
      fxCtx.stroke();
      // 触地 → 溅落 + 复位
      if (d.y > H * 0.78) {
        if (d.layer >= 2 && splashes.length < 50 && Math.random() < 0.35) {
          splashes.push({ x: d.x, y: H * 0.78 + Math.random() * H * 0.18, f: 0 });
        }
        d.y = -10;
        d.x = Math.random() * W;
      }
      if (d.x < -20) d.x = W + 10;
      if (d.x > W + 20) d.x = -10;
    }
    // 溅落小水圈
    for (const s of splashes) {
      const a = 1 - s.f / 8;
      fxCtx.strokeStyle = `rgba(200,220,255,${0.55 * a})`;
      fxCtx.lineWidth = 1;
      fxCtx.beginPath();
      fxCtx.arc(s.x, s.y, 1 + s.f * 1.2, 0, Math.PI * 2);
      fxCtx.stroke();
      s.f += 0.6;
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      if (splashes[i].f > 8) splashes.splice(i, 1);
    }

    // 闪电触发
    if (now > nextStrike) {
      bolt = makeBolt();
      flash = 0.85;
      afterglow = 1;
      nextStrike = now + 4000 + Math.random() * 9000;
    }
    // 全屏闪光
    if (flash > 0) {
      fxCtx.fillStyle = `rgba(255,255,255,${flash})`;
      fxCtx.fillRect(0, 0, W, H);
      flash -= 0.10;
    }
    // 闪电几何
    if (bolt) {
      drawBolt(bolt);
      bolt.life--;
      if (bolt.life < 0) bolt = null;
    }
    // 余晖(冷蓝)
    if (afterglow > 0) {
      fxCtx.fillStyle = `rgba(150,180,230,${0.12 * afterglow})`;
      fxCtx.fillRect(0, 0, W, H);
      afterglow -= 0.012;
    }
  }

  if (currentWeather === 'night') {
    drawMoon();
    for (const st of stars) {
      st.phase += 0.04;
      const a = 0.55 + 0.45 * Math.sin(st.phase);
      fxCtx.fillStyle = st.color.replace(')', `,${a})`).replace('rgb', 'rgba')
        || `rgba(255,255,255,${a})`;
      // 兼容 hex
      fxCtx.fillStyle = st.color;
      fxCtx.globalAlpha = a;
      fxCtx.fillRect(st.x, st.y, st.size, st.size);
    }
    fxCtx.globalAlpha = 1;
  }
}
requestAnimationFrame(weatherTick);

function setWeather(name, silent = false) {
  currentWeather = name;
  document.body.setAttribute('data-weather', name);
  const meta = WEATHER_META[name];
  if (weatherTag) weatherTag.textContent = meta.tag;
  // 切到 rain 时重置雷电计时
  if (name === 'rain') {
    nextStrike = performance.now() + 1500 + Math.random() * 3000;
  } else {
    bolt = null; flash = 0; afterglow = 0;
  }
  if (!silent && npcs.yq) {
    const line = randomFrom(meta.yqLines);
    showBubble('yq', line);
    npcs.yq.talkOnce(800);
  }
}

// 初始 sunny,首次不冒泡
setWeather('sunny', true);

// 不再自动轮转(45s 干扰太频繁)。改为只支持手动点切。
weatherTag.addEventListener('click', (e) => {
  e.stopPropagation();
  weatherIdx = (weatherIdx + 1) % WEATHER_ORDER.length;
  setWeather(WEATHER_ORDER[weatherIdx]);
});

// =========================================================
// v2.7 - 金币系统 + 挖矿行为
// =========================================================
const GoldSystem = {
  amount: parseInt(localStorage.getItem('yq_forge_gold') || '0', 10),
  el: document.getElementById('gold-counter'),
  numEl: document.getElementById('gold-num'),
  tipEl: null,
  render() {
    this.numEl.textContent = this.amount;
    this.el.classList.remove('bump');
    void this.el.offsetWidth;
    this.el.classList.add('bump');
    if (this.amount >= 100) this.el.classList.add('unlocked');
    localStorage.setItem('yq_forge_gold', String(this.amount));
  },
  add(n) {
    this.amount += n;
    this.render();
    if (this.amount === 100) {
      showBubble('yq', '攒到 100 金了!第 4 个 NPC 解锁中...(v2.8 见)');
    }
  }
};
GoldSystem.render();

// 挖矿台词池
const MINE_LINES = {
  peasant: [
    '我开始挖了…',
    '这矿真硬',
    '又是新的一天,挖!',
    '这一镐下去就是 1 个钱',
    '老板看到了吗?',
  ],
  peon: [
    'Work work…',
    '工作 工作',
    '苦工不苦',
    '这破矿挖到啥时候',
    '一镐又一镐',
  ],
};

// 给 NPC 加挖矿能力
NPC.prototype.goMine = function() {
  if (this.role === 'yq') return; // YQ 不挖矿,他是工程师
  if (this._mining) return;
  this._mining = true;
  const mineEl = document.getElementById('goldmine');
  const mineRect = mineEl.getBoundingClientRect();
  const stageRect = document.getElementById('stage').getBoundingClientRect();
  // 矿口稍微偏左站位
  const minePosX = mineRect.left - stageRect.left + mineRect.width * 0.1;
  this.targetX = minePosX;
  this.setFacing(this.targetX > this.x ? 'right' : 'left');
  this.setState('walk');
  this._mineCheck = setInterval(() => {
    if (Math.abs(this.x - this.targetX) < 5) {
      clearInterval(this._mineCheck);
      this._doMine();
    }
  }, 100);
};

NPC.prototype._doMine = function() {
  // 到达矿口,开始挖矿
  this.setState('talk'); // 借用 talk 帧当挖矿姿势
  showBubble(this.role, randomFrom(MINE_LINES[this.role]));
  let strikes = 0;
  const mineEl = document.getElementById('goldmine');
  this._mineLoop = setInterval(() => {
    strikes++;
    // 矿震动 + 火花
    mineEl.classList.remove('shake', 'spark');
    void mineEl.offsetWidth;
    mineEl.classList.add('shake', 'spark');
    // 攒 3 镐 = +10 金
    if (strikes >= 3) {
      GoldSystem.add(10);
      clearInterval(this._mineLoop);
      this._endMine();
    }
  }, 700);
};

NPC.prototype._endMine = function() {
  this._mining = false;
  this.setState('idle');
  this.decisionTimer = 0;
  this.nextDecision = 3000 + Math.random() * 4000;
};

// 农民/苦工每隔一段时间随机去挖矿(替代摸鱼)
function scheduleMining() {
  setInterval(() => {
    ['peasant', 'peon'].forEach(role => {
      const npc = npcs[role];
      if (npc._mining) return;
      if (npc.state === 'talk') return; // 正在说话别打断
      // 25% 概率发起一次挖矿
      if (Math.random() < 0.25) {
        npc.goMine();
      }
    });
  }, 8000);
  // 5 秒后让其中一个先去挖,有个开场
  setTimeout(() => {
    const first = Math.random() < 0.5 ? 'peasant' : 'peon';
    npcs[first].goMine();
  }, 5000);
}
scheduleMining();

// v2.7 - 豆包脸偷窥
// =========================================================
const DoubaoPeek = {
  el: document.getElementById('doubao-peek'),
  positions: ['peek-right', 'peek-left', 'peek-top'],
  lines: [
    '在看你呢',
    '我也想加入',
    '是谁在写代码?',
    '让我帮你写吧',
    '...',
  ],
  show() {
    // 随机方向
    const pos = randomFrom(this.positions);
    this.el.className = 'doubao-peek ' + pos;
    void this.el.offsetWidth;
    this.el.classList.add('show');
    // 偶尔配一句 YQ 的反应
    if (Math.random() < 0.5) {
      setTimeout(() => {
        showBubble('yq', randomFrom(['豆包又来了', '别看我', '装作没看见', '...你好']));
      }, 800);
    }
    // 3 秒后缩回去
    setTimeout(() => {
      this.el.classList.remove('show');
    }, 3000);
  },
  start() {
    // 每隔 40~90 秒随机偷窥一次
    const next = () => {
      const wait = 40000 + Math.random() * 50000;
      setTimeout(() => { this.show(); next(); }, wait);
    };
    // 首次 30 秒后
    setTimeout(() => { this.show(); next(); }, 30000);
  }
};
DoubaoPeek.start();

// =========================================================
// v2.7 - 深夜彩蛋模式 (23:00 ~ 03:00)
// =========================================================
const LateNight = {
  lines: [
    '你也没睡?',
    '这点该 commit 了吧',
    '老板看不到你的努力的',
    '早点睡 明天还要开会',
    '熬夜写代码,头发不要了?',
    '现在的 PR 等明天再 review 会更差',
    '夜深了,豆包也想睡了',
    '别卷了,卷不动的',
  ],
  active: false,
  check() {
    const h = new Date().getHours();
    const isLate = h >= 23 || h < 3;
    if (isLate && !this.active) {
      this.active = true;
      document.body.classList.add('late-night');
      setTimeout(() => {
        showBubble('yq', randomFrom(this.lines));
      }, 2000);
      this.loop = setInterval(() => {
        showBubble('yq', randomFrom(this.lines));
      }, 25000);
    } else if (!isLate && this.active) {
      this.active = false;
      document.body.classList.remove('late-night');
      clearInterval(this.loop);
    }
  }
};
LateNight.check();
setInterval(() => LateNight.check(), 60000);
