<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YQ 铁匠铺 · 打工人语音面板 v2.5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  body {
    background: url("assets/img/bg.jpeg") center/cover no-repeat;
    position: relative;
    user-select: none;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,15,10,0.10) 0%, rgba(20,15,10,0.30) 100%);
    pointer-events: none;
    z-index: 1;
    transition: background 1.5s ease;
  }

  /* ============ 天气系统 v2.5 ============
     设计：canvas 渲染雨滴/闪电/月亮/星星(性能 +可控)
            CSS 只负责持久调色 tint 层(背景滤镜)
            保留背景层次,不一片灰
  ============================================ */

  /* 调色 tint —— mix-blend-mode 保留底图细节 */
  .tint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 1s ease;
  }
  body[data-weather="sunny"] .tint.sunny {
    opacity: 1;
    background: radial-gradient(ellipse at 75% 10%, rgba(255,230,120,0.35) 0%, rgba(255,180,80,0.10) 25%, transparent 55%);
  }
  body[data-weather="rain"] .tint.rain {
    opacity: 1;
    background: linear-gradient(180deg, rgba(20,30,50,0.25) 0%, rgba(20,40,70,0.45) 100%);
    mix-blend-mode: multiply;
  }
  body[data-weather="night"] .tint.night {
    opacity: 1;
    background: linear-gradient(180deg, rgba(20,20,55,0.55) 0%, rgba(8,8,30,0.80) 100%);
    mix-blend-mode: multiply;
  }

  /* canvas 全屏画特效 */
  .fx-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* 天气指示器(右上角小标签) */
  .weather-tag {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .weather-tag:hover {
    background: rgba(40,30,20,0.85);
  }

  /* 顶部 hint 条 */
  .hint {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 12px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
  }
  .hint .key { color: #ffd766; font-weight: bold; }

  /* 舞台 —— 整个视窗作为活动区域，NPC 用 absolute 自由行走 */
  .stage {
    position: absolute; inset: 0;
    z-index: 5;
  }

  /* 地面带 —— 底部 35% 是 NPC 行走范围，仅用于视觉调试可去掉 */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 35%;
    pointer-events: none;
  }

  /* NPC */
  .npc {
    position: absolute;
    bottom: 0;
    cursor: pointer;
    transition: transform 0.18s ease-out;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.45));
    will-change: left, transform;
  }
  .npc:hover {
    transform: translateY(-6px) scale(1.04);
  }
  .npc.talking {
    animation: shake 0.4s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-4px) rotate(-2deg) scale(1.05); }
    50% { transform: translateY(-8px) rotate(0) scale(1.06); }
    75% { transform: translateY(-4px) rotate(2deg) scale(1.05); }
  }
  /* 角色 img 单独翻转,不影响气泡/名牌 */
  .sprite {
    height: 38vh;
    max-height: 320px;
    display: block;
    transition: transform 0.1s linear;
  }
  .npc[data-facing="left"] .sprite {
    transform: scaleX(-1);
  }

  /* 名牌 */
  .nameplate {
    position: absolute;
    bottom: -22px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* 对话气泡 —— 像素风游戏台词框 */
  .bubble {
    position: absolute;
    top: -64px;
    left: 50%; transform: translateX(-50%) scale(0);
    background: linear-gradient(180deg, #f8e7b8 0%, #e8c98a 100%);
    color: #2a1a05;
    padding: 10px 18px;
    font-size: 18px;
    font-weight: bold;
    font-family: "Courier New", "PingFang SC", monospace;
    letter-spacing: 1px;
    /* 多层 box-shadow 模拟像素台阶边框 */
    box-shadow:
      0 0 0 3px #2a1a05,
      0 0 0 6px #d4a85a,
      0 0 0 9px #2a1a05,
      6px 6px 0 9px rgba(0,0,0,0.45);
    border-radius: 2px;
    transition: transform 0.22s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    pointer-events: none;
    max-width: 280px;
    white-space: normal;
    text-align: center;
    line-height: 1.35;
    z-index: 9;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
  }
  .bubble.show {
    transform: translateX(-50%) scale(1);
  }
  /* 像素风台阶式小尖角 —— 用伪元素堆三层方块模拟 */
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -9px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 6px;
    background: #e8c98a;
    box-shadow:
      -3px 0 0 #e8c98a,
      3px 0 0 #e8c98a,
      0 0 0 3px #2a1a05,
      -3px 3px 0 #2a1a05,
      3px 3px 0 #2a1a05;
  }
  .bubble::before {
    content: "";
    position: absolute;
    bottom: -15px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px;
    background: #e8c98a;
    box-shadow: 0 0 0 3px #2a1a05;
  }

  /* footer 计数器 */
  .footer {
    position: absolute;
    bottom: 8px; left: 12px;
    z-index: 10;
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 1px;
  }
  .footer span { color: #ffd766; }

  /* 全局喊话按钮 */
  .global-btn {
    position: absolute;
    bottom: 8px; right: 12px;
    z-index: 10;
    background: rgba(120,40,30,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
  }
  .global-btn:hover {
    background: rgba(170,60,40,0.95);
  }

  /* 静音切换按钮 */
  .mute-btn {
    position: absolute;
    bottom: 8px; right: 92px;
    z-index: 10;
    background: rgba(40,30,20,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
    min-width: 64px;
    text-align: center;
  }
  .mute-btn:hover {
    background: rgba(70,55,35,0.95);
  }
  .mute-btn.muted {
    background: rgba(60,60,60,0.85);
    color: #999;
    border-color: #666;
  }
</style>
</head>
<body>

<div class="hint">
  <span class="key">👆 点击 NPC</span> 听他说话 · <span class="key">他们会自己瞎逛</span>
</div>

<!-- 天气调色层(只负责持久滤镜,canvas 负责粒子) -->
<div class="tint sunny"></div>
<div class="tint rain"></div>
<div class="tint night"></div>

<!-- 天气特效 canvas(雨/闪电/月亮/星星) -->
<canvas class="fx-canvas" id="fx-canvas"></canvas>

<!-- 右上角天气指示器,点击手动切换 -->
<div class="weather-tag" id="weather-tag" title="点击切换天气">☀️ 晴</div>

<div class="stage" id="stage">
  <!-- 人族农民 -->
  <div class="npc" id="peasant" data-role="peasant" data-facing="right">
    <div class="bubble" id="bubble-peasant"></div>
    <img class="sprite" id="img-peasant" src="assets/img/peasant_idle1.png" alt="Peasant" />
    <div class="nameplate">⚔ 人族农民</div>
  </div>

  <!-- 兽族苦工 -->
  <div class="npc" id="peon" data-role="peon" data-facing="left">
    <div class="bubble" id="bubble-peon"></div>
    <img class="sprite" id="img-peon" src="assets/img/peon_idle1.png" alt="Peon" />
    <div class="nameplate">🪓 兽族苦工</div>
  </div>

  <!-- 工程师 YQ -->
  <div class="npc" id="yq" data-role="yq" data-facing="right">
    <div class="bubble" id="bubble-yq"></div>
    <img class="sprite" id="img-yq" src="assets/img/yq_idle1.png" alt="YQ" />
    <div class="nameplate">💻 工程师 YQ</div>
  </div>
</div>

<div class="footer">
  YQ 的铁匠铺 · 打工人语音面板 v2.5 · 点击数:<span id="counter">0</span>
</div>

<button class="mute-btn" id="mute-btn" title="切换语音">🔊 有声</button>
<button class="global-btn" id="global-btn">🔔 集结!</button>

<script>
// =========================================================
// 1. 资源池
// =========================================================
const SPRITES = {
  peasant: {
    idle:  ['assets/img/peasant_idle1.png'],
    walk:  ['assets/img/peasant_walk1.png', 'assets/img/peasant_walk2.png'],
    talk:  ['assets/img/peasant_talk1.png'],
  },
  peon: {
    idle:  ['assets/img/peon_idle1.png'],
    walk:  ['assets/img/peon_walk1.png', 'assets/img/peon_walk2.png'],
    talk:  ['assets/img/peon_talk1.png'],
  },
  yq: {
    idle:  ['assets/img/yq_idle1.png'],
    walk:  ['assets/img/yq_walk1.png', 'assets/img/yq_walk2.png'],
    talk:  ['assets/img/yq_talk1.png'],
  },
};

const VOICE_POOL = {
  peasant: {
    yes:       ['peasantyes1', 'peasantyes2', 'peasantyes3', 'peasantyes4'],
    what:      ['peasantwhat1', 'peasantwhat2', 'peasantwhat3', 'peasantwhat4'],
    pissed:    ['peasantpissed1', 'peasantpissed2', 'peasantpissed3', 'peasantpissed4', 'peasantpissed5'],
    ready:     ['peasantready1'],
    yesattack: ['peasantyesattack1', 'peasantyesattack2', 'peasantyesattack3', 'peasantyesattack4'],
    warcry:    ['peasantwarcry1'],
  },
  peon: {
    yes:       ['peonyes1', 'peonyes2', 'peonyes3', 'peonyes4'],
    what:      ['peonwhat1', 'peonwhat2', 'peonwhat3', 'peonwhat4'],
    pissed:    ['peonpissed1', 'peonpissed2', 'peonpissed3', 'peonpissed4'],
    ready:     ['peonready1'],
    yesattack: ['peonyesattack1', 'peonyesattack2', 'peonyesattack3'],
    warcry:    ['peonwarcry1'],
  },
  // YQ 无语音
};

const BUBBLE_LINES = {
  peasant: {
    yes:       ['好的老爷!', '收到!', '没问题!', '马上!'],
    what:      ['啥?', '你想干嘛?', '叫我?', '咋了?'],
    pissed:    ['又要干活...', '忙着呢,别烦我', '能不能歇会儿', '我累了!'],
    yesattack: ['行了,我去送死了', '上!', '冲啊!'],
    warcry:    ['相信自己我能行!'],
  },
  peon: {
    yes:       ['是,老大', 'ok!', '懂了', '马上去'],
    what:      ['啊?', '咋啦?', '叫俺?'],
    pissed:    ['忙啊忙', '我可不是那种兽人', '别催我啊', '砍累了'],
    yesattack: ['我去会会他们!', '战斗!'],
    warcry:    ['为了部落!'],
  },
  // YQ 的台词池 —— 工程师 × AI 协作日常吐槽
  yq: {
    idle: [
      'AI的地震来了,可我却测不出震级(狗头)',
      'AI比我更懂这个项目',
      '我负责拍脑袋,AI 负责拍键盘',
      'AI 说"你说得对",我心里一紧',
      '又被 AI 一本正经地骗了',
      'AI 把 TODO 实现了,逻辑是错的',
      '我现在的工作是给AI当小弟',
      'AI 给的方案太通用了,像没说',
      '让它简化一下,它给我重写了',
      '问它"为什么",它开始道歉',
      'Diff 太长,AI 自己都不看了',
      '幻觉是它的,背锅是我的',
      '今天的灵感来自一次 retry',
      '我不是在摸鱼,我在等GPT 5.5',
      '能跑就别动,动了就别问我',
      '有什么需求,跟我的Agent去说吧',
      '让它解释代码,它先道了个歉',
      'AI 写的注释比代码长',
      '我让它再想想,它换了个错法',
      '回滚到 AI 介入之前',
      'AI时代我还是苦工,只是挖矿的方式不一样了',
    ],
  },
};

// =========================================================
// 2. 全局状态
// =========================================================
const CLICK_STATE = { peasant: 0, peon: 0, yq: 0 };
let totalClicks = 0;
let currentAudio = null;   // 🔥 关键: 单声道,新音频会取消旧音频
let isMuted = (localStorage.getItem('yq_forge_muted') === '1');  // 🔇 静音状态,持久化

// 行走范围:水平 5% ~ 95% (px 算)
const STAGE = document.getElementById('stage');

// =========================================================
// 3. 工具函数
// =========================================================
function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getStageWidth() {
  return STAGE.clientWidth || window.innerWidth;
}

// =========================================================
// 4. 音频播放(带取消机制)
// =========================================================
function playVoice(role, emotion) {
  if (!VOICE_POOL[role]) return null; // YQ 无声
  if (isMuted) return null;           // 🔇 用户静音了
  const pool = VOICE_POOL[role][emotion];
  if (!pool || pool.length === 0) return null;

  // 🔥 取消正在播放的音频
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
    currentAudio = null;
  }

  const file = randomFrom(pool);
  const audio = new Audio(`assets/audio/${role}/${file}.wav`);
  audio.volume = 0.85;
  audio.play().catch(err => console.warn('音频播放失败:', err));
  currentAudio = audio;
  // 播完清空引用,避免后续误取消
  audio.addEventListener('ended', () => {
    if (currentAudio === audio) currentAudio = null;
  });
  return audio;
}

// =========================================================
// 5. 气泡显示
// =========================================================
function showBubble(role, text) {
  const bubble = document.getElementById(`bubble-${role}`);
  if (!bubble) return;
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => bubble.classList.remove('show'), 2200);
}

// =========================================================
// 6. NPC 控制器(每个 NPC 一个实例,管动画 + 走路)
// =========================================================
class NPC {
  constructor(role, startXPercent) {
    this.role = role;
    this.el = document.getElementById(role);
    this.img = document.getElementById(`img-${role}`);
    this.frames = SPRITES[role];

    // 位置(px)
    this.x = (getStageWidth() * startXPercent) / 100;
    this.targetX = this.x;
    this.speed = 0.6; // px / frame
    this.state = 'idle'; // idle | walk | talk
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.lastTs = performance.now();

    // 决策计时器:每隔 N ms 决定下一步做什么
    this.decisionTimer = 0;
    this.nextDecision = 1500 + Math.random() * 2000;

    this.applyPos();
    requestAnimationFrame(this.tick.bind(this));
  }

  applyPos() {
    this.el.style.left = `${this.x}px`;
    this.el.style.transform = 'translateX(-50%)';
  }

  setState(state) {
    if (this.state === state) return;
    this.state = state;
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.updateFrame();
  }

  updateFrame() {
    const pool = this.frames[this.state] || this.frames.idle;
    const src = pool[this.frameIdx % pool.length];
    if (this.img.getAttribute('src') !== src) {
      this.img.setAttribute('src', src);
    }
  }

  setFacing(dir) {
    this.el.dataset.facing = dir;
  }

  pickNewTarget() {
    const w = getStageWidth();
    // 在 5% ~ 95% 范围随机
    const min = w * 0.05;
    const max = w * 0.95;
    this.targetX = min + Math.random() * (max - min);
    this.setFacing(this.targetX > this.x ? 'right' : 'left');
    this.setState('walk');
  }

  talkOnce(durationMs = 600) {
    this.setState('talk');
    clearTimeout(this._talkTimer);
    this._talkTimer = setTimeout(() => {
      // 说完回到 idle(或者继续 walk 如果之前在走)
      this.setState('idle');
      this.decisionTimer = 0;
      this.nextDecision = 1500 + Math.random() * 2000;
    }, durationMs);
  }

  tick(ts) {
    const dt = Math.min(50, ts - this.lastTs);
    this.lastTs = ts;

    // 行走逻辑
    if (this.state === 'walk') {
      const dx = this.targetX - this.x;
      if (Math.abs(dx) < 2) {
        // 到达,切回 idle 等待下次决策
        this.x = this.targetX;
        this.applyPos();
        this.setState('idle');
        this.decisionTimer = 0;
        this.nextDecision = 1500 + Math.random() * 3000;
      } else {
        const step = Math.sign(dx) * this.speed * (dt / 16.67);
        this.x += step;
        this.applyPos();
      }
    }

    // 帧动画切换
    this.frameTimer += dt;
    const cadence = this.state === 'walk' ? 220 : 600;
    if (this.frameTimer >= cadence) {
      this.frameTimer = 0;
      this.frameIdx++;
      this.updateFrame();
    }

    // 自主决策:idle 状态下隔一段时间随机决定下一步
    if (this.state === 'idle') {
      this.decisionTimer += dt;
      if (this.decisionTimer >= this.nextDecision) {
        this.decisionTimer = 0;
        // 60% 概率走起来,40% 继续发呆
        if (Math.random() < 0.6) {
          this.pickNewTarget();
        } else {
          this.nextDecision = 1500 + Math.random() * 2500;
        }
      }
    }

    requestAnimationFrame(this.tick.bind(this));
  }
}

// =========================================================
// 7. 实例化 3 个 NPC
// =========================================================
const npcs = {
  peasant: new NPC('peasant', 25),
  peon:    new NPC('peon',    50),
  yq:      new NPC('yq',      75),
};

// =========================================================
// 8. 点击交互
// =========================================================
function getEmotionByClickCount(count) {
  if (Math.random() < 0.08) {
    return Math.random() < 0.5 ? 'yesattack' : 'warcry';
  }
  if (count === 1) return 'yes';
  if (count <= 3) return 'what';
  return 'pissed';
}

function triggerNPC(role) {
  CLICK_STATE[role] += 1;
  totalClicks += 1;
  document.getElementById('counter').textContent = totalClicks;

  const npc = npcs[role];

  if (role === 'yq') {
    // YQ 没有语音,只冒话,且气泡内容固定走 idle 池
    const line = randomFrom(BUBBLE_LINES.yq.idle);
    showBubble('yq', line);
    npc.talkOnce(900);
    npc.el.classList.remove('talking');
    void npc.el.offsetWidth;
    npc.el.classList.add('talking');
    return;
  }

  const emotion = getEmotionByClickCount(CLICK_STATE[role]);
  const lines = BUBBLE_LINES[role][emotion] || [];
  if (lines.length) showBubble(role, randomFrom(lines));
  playVoice(role, emotion);

  // 切到 talk 帧
  npc.talkOnce(800);

  // 视觉抖动
  npc.el.classList.remove('talking');
  void npc.el.offsetWidth;
  npc.el.classList.add('talking');
}

document.querySelectorAll('.npc').forEach(el => {
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerNPC(el.dataset.role);
  });
});

// =========================================================
// 9. 全局集结按钮 —— 农民 + 苦工 + YQ 都喊
// =========================================================
document.getElementById('global-btn').addEventListener('click', () => {
  triggerNPC('peasant');
  setTimeout(() => triggerNPC('peon'), 350);
  setTimeout(() => {
    // YQ 的集结台词单独搞个燃一点的
    showBubble('yq', '走,炼点新东西去!');
    npcs.yq.talkOnce(900);
    npcs.yq.el.classList.remove('talking');
    void npcs.yq.el.offsetWidth;
    npcs.yq.el.classList.add('talking');
  }, 700);
});

// 🔇 静音按钮：切换 isMuted + 持久化 + 当场掐掉正在播的
const muteBtn = document.getElementById('mute-btn');
function refreshMuteBtn() {
  if (isMuted) {
    muteBtn.classList.add('muted');
    muteBtn.textContent = '🔇 已静音';
    muteBtn.title = '点击恢复语音';
  } else {
    muteBtn.classList.remove('muted');
    muteBtn.textContent = '🔊 有声';
    muteBtn.title = '点击静音(只保留台词框)';
  }
}
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isMuted = !isMuted;
  localStorage.setItem('yq_forge_muted', isMuted ? '1' : '0');
  // 立刻掐掉正在播的
  if (isMuted && currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (_) {}
    currentAudio = null;
  }
  refreshMuteBtn();
  // 给个轻反馈
  showBubble('yq', isMuted ? '世界安静了' : '吵起来吧!');
  npcs.yq.talkOnce(700);
});
refreshMuteBtn();

// =========================================================
// 10. 入场播报 + 环境氛围
// =========================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    showBubble('peasant', '准备干活!');
    playVoice('peasant', 'ready');
    npcs.peasant.talkOnce(700);
  }, 1000);

  setTimeout(() => {
    showBubble('yq', '欢迎来到我的铁匠铺');
    npcs.yq.talkOnce(900);
  }, 2200);
});

// 农民/苦工:每 30~50 秒随机一个自言自语
setInterval(() => {
  const role = Math.random() < 0.5 ? 'peasant' : 'peon';
  const emotion = Math.random() < 0.6 ? 'pissed' : 'what';
  const lines = BUBBLE_LINES[role][emotion];
  if (lines && lines.length) showBubble(role, randomFrom(lines));
  playVoice(role, emotion);
  npcs[role].talkOnce(700);
}, 38000);

// YQ:每 12~20 秒冒一句话(无声)
function scheduleYQTalk() {
  const delay = 12000 + Math.random() * 8000;
  setTimeout(() => {
    const line = randomFrom(BUBBLE_LINES.yq.idle);
    showBubble('yq', line);
    npcs.yq.talkOnce(900);
    scheduleYQTalk();
  }, delay);
}
scheduleYQTalk();

// 窗口 resize:把 NPC 限制回新视窗范围内
window.addEventListener('resize', () => {
  const w = getStageWidth();
  Object.values(npcs).forEach(n => {
    n.x = Math.min(Math.max(n.x, w * 0.05), w * 0.95);
    n.targetX = Math.min(Math.max(n.targetX, w * 0.05), w * 0.95);
    n.applyPos();
  });
});

// =========================================================
// 11. 天气系统 v2.5 —— canvas 渲染,戏剧化像素风
//   - 雨：3 层视差 + 风向摇摆 + 地面溅落 sprite
//   - 暴雨：随机闪电(全屏闪光 + 锯齿闪电几何 + 蓝色余晖)
//   - 夜：星空缓动闪烁 + 像素月亮
//   - 切换：手动点右上角(sunny→rain→night→sunny)
// =========================================================
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
fxCtx.imageSmoothingEnabled = false;

const WEATHER_ORDER = ['sunny', 'rain', 'night'];
const WEATHER_META = {
  sunny: { tag: '☀️ 晴',  yqLines: ['天好,代码也跑得欢', '阳光这么好,适合等 CI', '今天的灵感来自一次 retry'] },
  rain:  { tag: '🌧 暴雨', yqLines: ['下雨打雷,服务器可别也下', '雨声陪我加班', '回滚到 AI 介入之前'] },
  night: { tag: '🌙 夜',  yqLines: ['夜了,但 Agent 不睡', '深夜的 commit 最危险', '我不是在摸鱼,我在等GPT 5.5'] },
};
let weatherIdx = 0;
let currentWeather = 'sunny';
const weatherTag = document.getElementById('weather-tag');

// canvas 尺寸适配 DPR
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fxCanvas.width  = window.innerWidth * dpr;
  fxCanvas.height = window.innerHeight * dpr;
  fxCanvas.style.width  = window.innerWidth + 'px';
  fxCanvas.style.height = window.innerHeight + 'px';
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ---- 粒子池 ----
const drops = [];      // 雨滴
const splashes = [];   // 溅落
const stars = [];      // 星星
let wind = 0;          // 当前风向(像素/帧)
let flash = 0;         // 全屏闪光强度 0~1
let afterglow = 0;     // 闪电后的蓝色余晖
let bolt = null;       // 当前闪电几何
let nextStrike = 0;    // 下次打雷的时间戳

function seedRain() {
  drops.length = 0;
  const W = window.innerWidth, H = window.innerHeight;
  // 3 层视差: layer 1 远小, 2 中, 3 近大
  for (let i = 0; i < 220; i++) {
    const layer = 1 + (i % 3);
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      v: 4 + Math.random() * 4 + layer * 2,
      layer,
    });
  }
}
function seedStars() {
  stars.length = 0;
  const W = window.innerWidth, H = window.innerHeight * 0.55; // 只在天空区域
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() < 0.85 ? 1 : 2,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() < 0.85 ? '#ffffff' : '#ffe080',
    });
  }
}
seedRain();
seedStars();

// 闪电：递归生成锯齿折线
function makeBolt() {
  const W = window.innerWidth, H = window.innerHeight;
  const startX = W * (0.2 + Math.random() * 0.6);
  const segments = [{ x: startX, y: 0 }];
  let y = 0;
  while (y < H * 0.7) {
    const last = segments[segments.length - 1];
    y += 15 + Math.random() * 25;
    segments.push({
      x: last.x + (Math.random() - 0.5) * 60,
      y,
    });
    // 偶尔来一道分叉
    if (Math.random() < 0.15) {
      let bx = last.x, by = last.y;
      const branch = [{ x: bx, y: by }];
      for (let i = 0; i < 4; i++) {
        bx += (Math.random() - 0.5) * 40;
        by += 12 + Math.random() * 18;
        branch.push({ x: bx, y: by });
      }
      segments.push({ branch });
    }
  }
  return { segments, life: 12 };
}
function drawBolt(b) {
  const a = b.life / 12;
  // 外层光晕
  fxCtx.strokeStyle = `rgba(180,200,255,${0.35 * a})`;
  fxCtx.lineWidth = 8;
  fxCtx.lineCap = 'round';
  fxCtx.beginPath();
  let prev = null;
  for (const s of b.segments) {
    if (s.branch) {
      fxCtx.moveTo(s.branch[0].x, s.branch[0].y);
      for (const p of s.branch) fxCtx.lineTo(p.x, p.y);
      continue;
    }
    if (!prev) fxCtx.moveTo(s.x, s.y);
    else fxCtx.lineTo(s.x, s.y);
    prev = s;
  }
  fxCtx.stroke();
  // 内核白光
  fxCtx.strokeStyle = `rgba(255,255,255,${a})`;
  fxCtx.lineWidth = 2;
  fxCtx.beginPath();
  prev = null;
  for (const s of b.segments) {
    if (s.branch) {
      fxCtx.moveTo(s.branch[0].x, s.branch[0].y);
      for (const p of s.branch) fxCtx.lineTo(p.x, p.y);
      continue;
    }
    if (!prev) fxCtx.moveTo(s.x, s.y);
    else fxCtx.lineTo(s.x, s.y);
    prev = s;
  }
  fxCtx.stroke();
}

function drawMoon() {
  const W = window.innerWidth;
  const cx = W * 0.82, cy = 80;
  // 月晕
  const halo = fxCtx.createRadialGradient(cx, cy, 10, cx, cy, 60);
  halo.addColorStop(0, 'rgba(255,240,200,0.45)');
  halo.addColorStop(1, 'rgba(255,240,200,0)');
  fxCtx.fillStyle = halo;
  fxCtx.fillRect(cx - 60, cy - 60, 120, 120);
  // 月本体(像素圆)
  fxCtx.fillStyle = '#fff5d4';
  for (let dy = -16; dy <= 16; dy += 2) {
    const w = Math.floor(Math.sqrt(256 - dy * dy));
    fxCtx.fillRect(cx - w, cy + dy, w * 2, 2);
  }
  // 月相阴影
  fxCtx.fillStyle = 'rgba(40,30,60,0.45)';
  for (let dy = -12; dy <= 12; dy += 2) {
    const w = Math.floor(Math.sqrt(144 - dy * dy));
    fxCtx.fillRect(cx - w - 6, cy + dy, w * 2, 2);
  }
}

let lastFrame = performance.now();
function weatherTick(now) {
  requestAnimationFrame(weatherTick);
  const dt = Math.min(40, now - lastFrame);
  lastFrame = now;
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (currentWeather === 'rain') {
    const W = window.innerWidth, H = window.innerHeight;
    // 风向缓慢摇摆,偶尔来一阵
    wind = Math.sin(now / 1800) * 2 + Math.sin(now / 350) * 0.4;

    // 雨滴
    fxCtx.lineCap = 'round';
    for (const d of drops) {
      const speed = d.v * (dt / 16.67);
      d.y += speed;
      d.x += wind * d.layer * 0.5;
      const alpha = 0.20 + d.layer * 0.22;
      fxCtx.strokeStyle = `rgba(190,210,240,${alpha})`;
      fxCtx.lineWidth = d.layer;
      fxCtx.beginPath();
      fxCtx.moveTo(d.x, d.y);
      fxCtx.lineTo(d.x - wind * 1.5, d.y - 5 * d.layer);
      fxCtx.stroke();
      // 触地 → 溅落 + 复位
      if (d.y > H * 0.78) {
        if (d.layer >= 2 && splashes.length < 50 && Math.random() < 0.35) {
          splashes.push({ x: d.x, y: H * 0.78 + Math.random() * H * 0.18, f: 0 });
        }
        d.y = -10;
        d.x = Math.random() * W;
      }
      if (d.x < -20) d.x = W + 10;
      if (d.x > W + 20) d.x = -10;
    }
    // 溅落小水圈
    for (const s of splashes) {
      const a = 1 - s.f / 8;
      fxCtx.strokeStyle = `rgba(200,220,255,${0.55 * a})`;
      fxCtx.lineWidth = 1;
      fxCtx.beginPath();
      fxCtx.arc(s.x, s.y, 1 + s.f * 1.2, 0, Math.PI * 2);
      fxCtx.stroke();
      s.f += 0.6;
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      if (splashes[i].f > 8) splashes.splice(i, 1);
    }

    // 闪电触发
    if (now > nextStrike) {
      bolt = makeBolt();
      flash = 0.85;
      afterglow = 1;
      nextStrike = now + 4000 + Math.random() * 9000;
    }
    // 全屏闪光
    if (flash > 0) {
      fxCtx.fillStyle = `rgba(255,255,255,${flash})`;
      fxCtx.fillRect(0, 0, W, H);
      flash -= 0.10;
    }
    // 闪电几何
    if (bolt) {
      drawBolt(bolt);
      bolt.life--;
      if (bolt.life < 0) bolt = null;
    }
    // 余晖(冷蓝)
    if (afterglow > 0) {
      fxCtx.fillStyle = `rgba(150,180,230,${0.12 * afterglow})`;
      fxCtx.fillRect(0, 0, W, H);
      afterglow -= 0.012;
    }
  }

  if (currentWeather === 'night') {
    drawMoon();
    for (const st of stars) {
      st.phase += 0.04;
      const a = 0.55 + 0.45 * Math.sin(st.phase);
      fxCtx.fillStyle = st.color.replace(')', `,${a})`).replace('rgb', 'rgba')
        || `rgba(255,255,255,${a})`;
      // 兼容 hex
      fxCtx.fillStyle = st.color;
      fxCtx.globalAlpha = a;
      fxCtx.fillRect(st.x, st.y, st.size, st.size);
    }
    fxCtx.globalAlpha = 1;
  }
}
requestAnimationFrame(weatherTick);

function setWeather(name, silent = false) {
  currentWeather = name;
  document.body.setAttribute('data-weather', name);
  const meta = WEATHER_META[name];
  if (weatherTag) weatherTag.textContent = meta.tag;
  // 切到 rain 时重置雷电计时
  if (name === 'rain') {
    nextStrike = performance.now() + 1500 + Math.random() * 3000;
  } else {
    bolt = null; flash = 0; afterglow = 0;
  }
  if (!silent && npcs.yq) {
    const line = randomFrom(meta.yqLines);
    showBubble('yq', line);
    npcs.yq.talkOnce(800);
  }
}

// 初始 sunny,首次不冒泡
setWeather('sunny', true);

// 不再自动轮转(45s 干扰太频繁)。改为只支持手动点切。
weatherTag.addEventListener('click', (e) => {
  e.stopPropagation();
  weatherIdx = (weatherIdx + 1) % WEATHER_ORDER.length;
  setWeather(WEATHER_ORDER[weatherIdx]);
});
</script>
