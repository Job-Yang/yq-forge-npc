<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YQ 铁匠铺 · 打工人语音面板 v2.4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  body {
    background: url("assets/img/bg.jpeg") center/cover no-repeat;
    position: relative;
    user-select: none;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,15,10,0.10) 0%, rgba(20,15,10,0.30) 100%);
    pointer-events: none;
    z-index: 1;
    transition: background 1.5s ease;
  }

  /* ============ 天气系统 ============ */
  /* 天气总开关挂在 body 上,通过 data-weather 控制 */
  body[data-weather="sunny"]::before {
    background: linear-gradient(180deg, rgba(255,220,140,0.10) 0%, rgba(255,180,80,0.20) 100%);
  }
  body[data-weather="cloudy"]::before {
    background: linear-gradient(180deg, rgba(120,120,130,0.25) 0%, rgba(80,80,90,0.45) 100%);
  }
  body[data-weather="rain"]::before {
    background: linear-gradient(180deg, rgba(40,55,75,0.45) 0%, rgba(20,30,50,0.65) 100%);
  }
  body[data-weather="night"]::before {
    background: linear-gradient(180deg, rgba(15,15,40,0.55) 0%, rgba(5,5,20,0.80) 100%);
  }

  /* 雨幕 —— CSS 重复线性渐变 */
  .weather-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  body[data-weather="rain"] .weather-layer.rain { opacity: 1; }
  .weather-layer.rain {
    background-image: repeating-linear-gradient(
      105deg,
      transparent 0,
      transparent 6px,
      rgba(200,220,255,0.35) 6px,
      rgba(200,220,255,0.35) 7px,
      transparent 7px,
      transparent 14px
    );
    animation: rain-fall 0.6s linear infinite;
  }
  @keyframes rain-fall {
    0%   { background-position: 0 0; }
    100% { background-position: -28px 60px; }
  }

  /* 夜晚星空 —— 多重 radial-gradient 模拟像素星点 */
  body[data-weather="night"] .weather-layer.stars { opacity: 1; }
  .weather-layer.stars {
    background-image:
      radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 28% 7%, #ffe080 50%, transparent 51%),
      radial-gradient(2px 2px at 47% 22%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 63% 11%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 82% 25%, #ffd766 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 5% 32%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 35% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 35%, #fff 50%, transparent 51%);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* 晴天 —— 顶部柔光 */
  body[data-weather="sunny"] .weather-layer.sun { opacity: 1; }
  .weather-layer.sun {
    background: radial-gradient(circle at 75% 8%, rgba(255,230,120,0.55) 0%, rgba(255,230,120,0.15) 12%, transparent 28%);
  }

  /* 阴天 —— 上方阴影压暗 */
  body[data-weather="cloudy"] .weather-layer.cloud { opacity: 1; }
  .weather-layer.cloud {
    background: linear-gradient(180deg, rgba(60,60,70,0.35) 0%, transparent 35%);
  }

  /* 天气指示器(右上角小标签) */
  .weather-tag {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .weather-tag:hover {
    background: rgba(40,30,20,0.85);
  }

  /* 顶部 hint 条 */
  .hint {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.55);
    color: #ffe9a8;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 12px;
    letter-spacing: 1px;
    border: 1px solid rgba(255,233,168,0.3);
  }
  .hint .key { color: #ffd766; font-weight: bold; }

  /* 舞台 —— 整个视窗作为活动区域，NPC 用 absolute 自由行走 */
  .stage {
    position: absolute; inset: 0;
    z-index: 5;
  }

  /* 地面带 —— 底部 35% 是 NPC 行走范围，仅用于视觉调试可去掉 */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 35%;
    pointer-events: none;
  }

  /* NPC */
  .npc {
    position: absolute;
    bottom: 0;
    cursor: pointer;
    transition: transform 0.18s ease-out;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.45));
    will-change: left, transform;
  }
  .npc:hover {
    transform: translateY(-6px) scale(1.04);
  }
  .npc.talking {
    animation: shake 0.4s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-4px) rotate(-2deg) scale(1.05); }
    50% { transform: translateY(-8px) rotate(0) scale(1.06); }
    75% { transform: translateY(-4px) rotate(2deg) scale(1.05); }
  }
  /* 角色 img 单独翻转,不影响气泡/名牌 */
  .sprite {
    height: 38vh;
    max-height: 320px;
    display: block;
    transition: transform 0.1s linear;
  }
  .npc[data-facing="left"] .sprite {
    transform: scaleX(-1);
  }

  /* 名牌 */
  .nameplate {
    position: absolute;
    bottom: -22px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.2);
  }

  /* 对话气泡 —— 像素风游戏台词框 */
  .bubble {
    position: absolute;
    top: -64px;
    left: 50%; transform: translateX(-50%) scale(0);
    background: linear-gradient(180deg, #f8e7b8 0%, #e8c98a 100%);
    color: #2a1a05;
    padding: 10px 18px;
    font-size: 18px;
    font-weight: bold;
    font-family: "Courier New", "PingFang SC", monospace;
    letter-spacing: 1px;
    /* 多层 box-shadow 模拟像素台阶边框 */
    box-shadow:
      0 0 0 3px #2a1a05,
      0 0 0 6px #d4a85a,
      0 0 0 9px #2a1a05,
      6px 6px 0 9px rgba(0,0,0,0.45);
    border-radius: 2px;
    transition: transform 0.22s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    pointer-events: none;
    max-width: 280px;
    white-space: normal;
    text-align: center;
    line-height: 1.35;
    z-index: 9;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
  }
  .bubble.show {
    transform: translateX(-50%) scale(1);
  }
  /* 像素风台阶式小尖角 —— 用伪元素堆三层方块模拟 */
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -9px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 6px;
    background: #e8c98a;
    box-shadow:
      -3px 0 0 #e8c98a,
      3px 0 0 #e8c98a,
      0 0 0 3px #2a1a05,
      -3px 3px 0 #2a1a05,
      3px 3px 0 #2a1a05;
  }
  .bubble::before {
    content: "";
    position: absolute;
    bottom: -15px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px;
    background: #e8c98a;
    box-shadow: 0 0 0 3px #2a1a05;
  }

  /* footer 计数器 */
  .footer {
    position: absolute;
    bottom: 8px; left: 12px;
    z-index: 10;
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 1px;
  }
  .footer span { color: #ffd766; }

  /* 全局喊话按钮 */
  .global-btn {
    position: absolute;
    bottom: 8px; right: 12px;
    z-index: 10;
    background: rgba(120,40,30,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
  }
  .global-btn:hover {
    background: rgba(170,60,40,0.95);
  }

  /* 静音切换按钮 */
  .mute-btn {
    position: absolute;
    bottom: 8px; right: 92px;
    z-index: 10;
    background: rgba(40,30,20,0.85);
    color: #ffe9a8;
    border: 1px solid #ffd766;
    padding: 6px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    font-family: inherit;
    min-width: 64px;
    text-align: center;
  }
  .mute-btn:hover {
    background: rgba(70,55,35,0.95);
  }
  .mute-btn.muted {
    background: rgba(60,60,60,0.85);
    color: #999;
    border-color: #666;
  }
</style>

<script>

const BUBBLE_LINES = {

    pissed:    ['忙啊忙', '我可不是那种兽人', '别催我啊', '砍累了'],
    yesattack: ['我去会会他们!', '战斗!'],

  // YQ 的台词池 —— 工程师 × AI 协作日常吐槽
  yq: {

// =========================================================
// 2. 全局状态
// =========================================================
const CLICK_STATE = { peasant: 0, peon: 0, yq: 0 };
let totalClicks = 0;
let currentAudio = null;   // 🔥 关键: 单声道,新音频会取消旧音频
let isMuted = (localStorage.getItem('yq_forge_muted') === '1');  // 🔇 静音状态,持久化

// 行走范围:水平 5% ~ 95% (px 算)
const STAGE = document.getElementById('stage');

// =========================================================
// 3. 工具函数
// =========================================================
function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getStageWidth() {
  return STAGE.clientWidth || window.innerWidth;
}

// =========================================================
// 4. 音频播放(带取消机制)
// =========================================================
function playVoice(role, emotion) {
  if (!VOICE_POOL[role]) return null; // YQ 无声
  if (isMuted) return null;           // 🔇 用户静音了
  const pool = VOICE_POOL[role][emotion];
  if (!pool || pool.length === 0) return null;

  // 🔥 取消正在播放的音频
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
    currentAudio = null;
  }

  const file = randomFrom(pool);
  const audio = new Audio(`assets/audio/${role}/${file}.wav`);
  audio.volume = 0.85;
  audio.play().catch(err => console.warn('音频播放失败:', err));
  currentAudio = audio;
  // 播完清空引用,避免后续误取消
  audio.addEventListener('ended', () => {
    if (currentAudio === audio) currentAudio = null;
  });
  return audio;
}

// =========================================================
// 5. 气泡显示
// =========================================================
function showBubble(role, text) {
  const bubble = document.getElementById(`bubble-${role}`);
  if (!bubble) return;
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => bubble.classList.remove('show'), 2200);
}

// =========================================================
// 6. NPC 控制器(每个 NPC 一个实例,管动画 + 走路)
// =========================================================
class NPC {
  constructor(role, startXPercent) {
    this.role = role;
    this.el = document.getElementById(role);
    this.img = document.getElementById(`img-${role}`);
    this.frames = SPRITES[role];

    // 位置(px)
    this.x = (getStageWidth() * startXPercent) / 100;
    this.targetX = this.x;
    this.speed = 0.6; // px / frame
    this.state = 'idle'; // idle | walk | talk
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.lastTs = performance.now();

    // 决策计时器:每隔 N ms 决定下一步做什么
    this.decisionTimer = 0;
    this.nextDecision = 1500 + Math.random() * 2000;

    this.applyPos();
    requestAnimationFrame(this.tick.bind(this));
  }

  applyPos() {
    this.el.style.left = `${this.x}px`;
    this.el.style.transform = 'translateX(-50%)';
  }

  setState(state) {
    if (this.state === state) return;
    this.state = state;
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.updateFrame();
  }

  updateFrame() {
    const pool = this.frames[this.state] || this.frames.idle;
    const src = pool[this.frameIdx % pool.length];
    if (this.img.getAttribute('src') !== src) {
      this.img.setAttribute('src', src);
    }
  }

  setFacing(dir) {
    this.el.dataset.facing = dir;
  }

  pickNewTarget() {
    const w = getStageWidth();
    // 在 5% ~ 95% 范围随机
    const min = w * 0.05;
    const max = w * 0.95;
    this.targetX = min + Math.random() * (max - min);
    this.setFacing(this.targetX > this.x ? 'right' : 'left');
    this.setState('walk');
  }

  talkOnce(durationMs = 600) {
    this.setState('talk');
    clearTimeout(this._talkTimer);
    this._talkTimer = setTimeout(() => {
      // 说完回到 idle(或者继续 walk 如果之前在走)
      this.setState('idle');
      this.decisionTimer = 0;
      this.nextDecision = 1500 + Math.random() * 2000;
    }, durationMs);
  }

  tick(ts) {
    const dt = Math.min(50, ts - this.lastTs);
    this.lastTs = ts;

    // 行走逻辑
    if (this.state === 'walk') {
      const dx = this.targetX - this.x;
      if (Math.abs(dx) < 2) {
        // 到达,切回 idle 等待下次决策
        this.x = this.targetX;
        this.applyPos();
        this.setState('idle');
        this.decisionTimer = 0;
        this.nextDecision = 1500 + Math.random() * 3000;
      } else {
        const step = Math.sign(dx) * this.speed * (dt / 16.67);
        this.x += step;
        this.applyPos();
      }
    }

    // 帧动画切换
    this.frameTimer += dt;
    const cadence = this.state === 'walk' ? 220 : 600;
    if (this.frameTimer >= cadence) {
      this.frameTimer = 0;
      this.frameIdx++;
      this.updateFrame();
    }

    // 自主决策:idle 状态下隔一段时间随机决定下一步
    if (this.state === 'idle') {
      this.decisionTimer += dt;
      if (this.decisionTimer >= this.nextDecision) {
        this.decisionTimer = 0;
        // 60% 概率走起来,40% 继续发呆
        if (Math.random() < 0.6) {
          this.pickNewTarget();
        } else {
          this.nextDecision = 1500 + Math.random() * 2500;
        }
      }
    }

    requestAnimationFrame(this.tick.bind(this));
  }
}

// =========================================================
// 7. 实例化 3 个 NPC

const npcs = {
  peasant: new NPC('peasant', 25),

// =========================================================
// 8. 点击交互
// =========================================================
function getEmotionByClickCount(count) {
  if (Math.random() < 0.08) {
    return Math.random() < 0.5 ? 'yesattack' : 'warcry';
  }
  if (count === 1) return 'yes';
  if (count <= 3) return 'what';
  return 'pissed';
}

function triggerNPC(role) {
  CLICK_STATE[role] += 1;
  totalClicks += 1;
  document.getElementById('counter').textContent = totalClicks;

  const npc = npcs[role];

  if (role === 'yq') {
    // YQ 没有语音,只冒话,且气泡内容固定走 idle 池
    const line = randomFrom(BUBBLE_LINES.yq.idle);
    showBubble('yq', line);
    npc.talkOnce(900);
    npc.el.classList.remove('talking');
    void npc.el.offsetWidth;
    npc.el.classList.add('talking');
    return;
  }

  const emotion = getEmotionByClickCount(CLICK_STATE[role]);
  const lines = BUBBLE_LINES[role][emotion] || [];
  if (lines.length) showBubble(role, randomFrom(lines));
  playVoice(role, emotion);

  // 切到 talk 帧
  npc.talkOnce(800);

  // 视觉抖动
  npc.el.classList.remove('talking');
  void npc.el.offsetWidth;
  npc.el.classList.add('talking');
}

document.querySelectorAll('.npc').forEach(el => {
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    triggerNPC(el.dataset.role);
  });
});

// =========================================================
// 9. 全局集结按钮 —— 农民 + 苦工 + YQ 都喊
// =========================================================
document.getElementById('global-btn').addEventListener('click', () => {
  triggerNPC('peasant');
  setTimeout(() => triggerNPC('peon'), 350);
  setTimeout(() => {
    // YQ 的集结台词单独搞个燃一点的
    showBubble('yq', '走,炼点新东西去!');
    npcs.yq.talkOnce(900);
    npcs.yq.el.classList.remove('talking');
    void npcs.yq.el.offsetWidth;
    npcs.yq.el.classList.add('talking');
  }, 700);
});

// 🔇 静音按钮：切换 isMuted + 持久化 + 当场掐掉正在播的
const muteBtn = document.getElementById('mute-btn');
function refreshMuteBtn() {
  if (isMuted) {
    muteBtn.classList.add('muted');
    muteBtn.textContent = '🔇 已静音';
    muteBtn.title = '点击恢复语音';
  } else {
    muteBtn.classList.remove('muted');
    muteBtn.textContent = '🔊 有声';
    muteBtn.title = '点击静音(只保留台词框)';
  }
}
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isMuted = !isMuted;
  localStorage.setItem('yq_forge_muted', isMuted ? '1' : '0');
  // 立刻掐掉正在播的
  if (isMuted && currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (_) {}
    currentAudio = null;
  }
  refreshMuteBtn();
  // 给个轻反馈
  showBubble('yq', isMuted ? '世界安静了' : '吵起来吧!');
  npcs.yq.talkOnce(700);
});
refreshMuteBtn();

// =========================================================
// 10. 入场播报 + 环境氛围
// =========================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    showBubble('peasant', '准备干活!');
    playVoice('peasant', 'ready');
    npcs.peasant.talkOnce(700);
  }, 1000);

  setTimeout(() => {
    showBubble('yq', '欢迎来到我的铁匠铺');
    npcs.yq.talkOnce(900);
  }, 2200);
});

// 农民/苦工:每 30~50 秒随机一个自言自语
setInterval(() => {
  const role = Math.random() < 0.5 ? 'peasant' : 'peon';
  const emotion = Math.random() < 0.6 ? 'pissed' : 'what';
  const lines = BUBBLE_LINES[role][emotion];
  if (lines && lines.length) showBubble(role, randomFrom(lines));
  playVoice(role, emotion);
  npcs[role].talkOnce(700);
}, 38000);

// YQ:每 12~20 秒冒一句话(无声)
function scheduleYQTalk() {
  const delay = 12000 + Math.random() * 8000;
  setTimeout(() => {
    const line = randomFrom(BUBBLE_LINES.yq.idle);
    showBubble('yq', line);
    npcs.yq.talkOnce(900);
    scheduleYQTalk();
  }, delay);
}
scheduleYQTalk();

// 窗口 resize:把 NPC 限制回新视窗范围内
window.addEventListener('resize', () => {
  const w = getStageWidth();
  Object.values(npcs).forEach(n => {
    n.x = Math.min(Math.max(n.x, w * 0.05), w * 0.95);
    n.targetX = Math.min(Math.max(n.targetX, w * 0.05), w * 0.95);
    n.applyPos();
  });
});

// =========================================================
// 11. 天气系统 —— 4 种天气轮转,每 45s 切一次,YQ 顺嘴评论
// =========================================================
const WEATHER_ORDER = ['sunny', 'cloudy', 'rain', 'night'];
const WEATHER_META = {
  sunny:  { tag: '☀️ 晴',   yqLines: ['天好,代码也跑得欢', '太阳出来了,我还在改 bug', '阳光这么好,适合等 CI'] },
  cloudy: { tag: '☁️ 多云', yqLines: ['阴天最适合写代码', '云挺厚,跟我的 PR 一样', '不晒,不冷,刚好 review'] },
  rain:   { tag: '🌧 雨',   yqLines: ['下雨了,服务器别也下', '雨声陪我加班', '下雨天和 AI 更配哦'] },
  night:  { tag: '🌙 夜',   yqLines: ['天黑了,AI 也该睡了吧', '夜了,但 Agent 不睡', '深夜的 commit 最危险'] },
};
let weatherIdx = 0;
const weatherTag = document.getElementById('weather-tag');

function setWeather(name, silent = false) {
  document.body.setAttribute('data-weather', name);
  const meta = WEATHER_META[name];
  if (weatherTag) weatherTag.textContent = meta.tag;
  if (!silent && npcs.yq) {
    const line = randomFrom(meta.yqLines);
    showBubble('yq', line);
    npcs.yq.talkOnce(800);
  }
}

// 初始 sunny,首次不冒泡
setWeather('sunny', true);

// 每 45 秒切换
setInterval(() => {
  weatherIdx = (weatherIdx + 1) % WEATHER_ORDER.length;
  setWeather(WEATHER_ORDER[weatherIdx]);
}, 45000);

// 点击右上角标签手动切换
weatherTag.addEventListener('click', (e) => {
  e.stopPropagation();
  weatherIdx = (weatherIdx + 1) % WEATHER_ORDER.length;
  setWeather(WEATHER_ORDER[weatherIdx]);
});
</script>
